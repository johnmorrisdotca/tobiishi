<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Tobiishi · peg solitaire</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}tobiishi-game{max-height:100%}</style></head><body><script type="module">
import "../dist/element-define.js";
import { SHAPES } from "../dist/index.js";
import { MATERIALS } from "../dist/draw.js";
const query=new URLSearchParams(location.search),game=document.createElement("tobiishi-game");game.setAttribute("size","medium");
for(const[name,choices]of[["shape",SHAPES],["material",MATERIALS],["theme",["auto","light","dark"]],["size",["small","medium","large"]],["lang",["en","ja"]],["language",["en","ja"]]])if(choices.includes(query.get(name)))game.setAttribute(name,query.get(name));
for(const[name,min,max]of[["width",100,2000],["challenge-jumps",1,100]]){const value=query.get(name);if(value!==null&&/^\d+$/.test(value)&&Number(value)>=min&&Number(value)<=max)game.setAttribute(name,value);}
for(const name of["controls","just-board"])if(query.has(name)&&["","true","on","1","false","off","no","0"].includes(query.get(name).trim().toLowerCase()))game.setAttribute(name,query.get(name));
const seed=query.get("seed");if(seed!==null&&seed.length<=200&&!/[\u0000-\u001f]/u.test(seed))game.setAttribute("seed",seed);const label=query.get("label");if(label!==null&&label.length<=200)game.setAttribute("label",label);if((query.get("lang")??query.get("language"))==="ja")document.documentElement.lang="ja";
for(const type of["tobiishi-load","tobiishi-change","tobiishi-error"])game.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(game);
</script></body></html>
